name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        cli: 1.12.0.1488

    - name: Run unit & generative tests
      run: clojure -M:runner
